<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CJP Discourse Analysis — Research Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="brand" id="brand" href="../landing/index.html" title="Back to landing page">CJP <span>Discourse</span></a>
        <button type="button" class="collapse-btn" id="collapse-btn" aria-expanded="true" title="Collapse sidebar">
          <span class="c-ico">«</span>
        </button>
      </div>
      <label class="search">
        <span class="sr">Find a section</span>
        <input id="find" type="search" placeholder="Find a section" autocomplete="off">
      </label>
      <nav id="nav" aria-label="Analysis steps"></nav>
      <div class="sidebar-foot">
        <span>CJP Discourse Analysis</span>
        <small>X (3,447) · Reddit (2,040)</small>
      </div>
    </aside>
    <main>
      <header class="top">
        <div>
          <p class="eyebrow" id="crumb">Presentation</p>
          <h1 id="title">Overview</h1>
        </div>
        <div class="top-meta">
          <span class="pill">7 Jun – 30 Jul 2024 · 5,487 posts</span>
        </div>
      </header>
      <div id="stage"></div>
    </main>
  </div>

  <!-- Lightbox modal for inspecting high-res research figures -->
  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="lb-title">
    <div class="lb-backdrop" id="lb-close-bg"></div>
    <div class="lb-panel">
      <div class="lb-head">
        <div>
          <p class="eyebrow" id="lb-tag">Research Figure</p>
          <h3 id="lb-title"></h3>
        </div>
        <button class="lb-close" id="lb-close" type="button" aria-label="Close figure">✕</button>
      </div>
      <div class="lb-body">
        <img id="lb-img" src="" alt="">
      </div>
      <p class="lb-cap" id="lb-cap"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
